[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-system"
version = "0.1.0"
description = "A macOS-first system health application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
pulse = "pulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
